<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎬 Avaliação de Filmes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4 text-center">Avaliação de Filmes</h1>

    <!-- Formulário para adicionar filme -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Adicionar novo filme</h5>
        <div class="input-group">
          <input type="text" id="novoFilme" class="form-control" placeholder="Nome do filme">
          <button class="btn btn-primary" onclick="adicionarFilme()">Adicionar</button>
        </div>
      </div>
    </div>

    <!-- Lista de filmes -->
    <div id="listaFilmes" class="row g-3"></div>
  </div>

  <!-- Modal de avaliações -->
  <div class="modal fade" id="avaliacoesModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="modalTitulo" class="modal-title">Avaliações</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <ul id="listaAvaliacoes" class="list-group mb-3"></ul>

          <h6>Nova avaliação</h6>
          <input type="number" id="nota" class="form-control mb-2" placeholder="Nota (0 a 10)" min="0" max="10">
          <button class="btn btn-success w-100" onclick="enviarAvaliacao()">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 🔗 altere para o IP do seu backend (ou localhost se for local)
    const API_URL = "http://localhost:3000";
    let filmeAtual = null;

    async function carregarFilmes() {
      const resp = await fetch(`${API_URL}/filmes`);
      const filmes = await resp.json();
      const container = document.getElementById("listaFilmes");
      container.innerHTML = "";

      filmes.forEach(f => {
        container.innerHTML += `
        <div class="col-md-4">
          <div class="card shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">${f.nome}</h5>              
                <button class="btn btn-outline-primary btn-sm"
                onclick="verAvaliacoes('${f.id}', '${f.titulo}')">Ver avaliações</button>
            </div>
          </div>
        </div>`;
      });
    }

    async function adicionarFilme() {
      const nome = document.getElementById("novoFilme").value.trim();
      if (!nome) return alert("Digite o nome do filme!");

      await fetch(`${API_URL}/filmes`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ titulo: nome, ano: 2025, genero: "Desconhecido" })
      });

      document.getElementById("novoFilme").value = "";
      carregarFilmes();
    }

    async function verAvaliacoes(id_filme, titulo) {
      filmeAtual = id_filme;
      document.getElementById("modalTitulo").textContent = `Avaliações de: ${titulo}`;

      const resp = await fetch(`${API_URL}/avaliacoes`);
      const avals = await resp.json();
      const lista = document.getElementById("listaAvaliacoes");
      const filtradas = avals.filter(a => a.id_filme === id_filme);

      lista.innerHTML = filtradas.map(a => `
        <li class="list-group-item">
          Nota: ${a.nota} <br>
          <small>${new Date(a.data).toLocaleString()}</small>
        </li>`).join("");

      new bootstrap.Modal(document.getElementById("avaliacoesModal")).show();
    }

    async function enviarAvaliacao() {
      const nota = parseInt(document.getElementById("nota").value);
      if (isNaN(nota)) return alert("Informe uma nota válida!");

      await fetch(`${API_URL}/avaliacoes`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ id_filme: filmeAtual, nota })
      });

      document.getElementById("nota").value = "";
      verAvaliacoes(filmeAtual, document.getElementById("modalTitulo").textContent);
    }

    carregarFilmes();
  </script>
</body>
</html>
